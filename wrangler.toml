# JWT Secret (set via Cloudflare dashboard > Workers & Pages > fionka > Settings > Variables > Secrets)
[vars]
JWT_SECRET = "fionka_jwt_secret_2026"

# Compatibility date
compatibility_date = "2025-04-01"
